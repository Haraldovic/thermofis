<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" fill="none">
  <title>Illustratives Energiekonzept mit Wohnhaus, Wärmepumpe und Fußbodenheizung</title>
  <desc>Architektonische Schnittillustration eines hellen Wohnhauses. Eine außen stehende Luft-Wasser-Wärmepumpe ist über Vorlauf und Rücklauf mit der Wärmeverteilung im Haus verbunden. Der geöffnete Fußboden zeigt eine schematische Heizrohrführung.</desc>
  <defs>
    <linearGradient id="ground" x1="265" y1="296" x2="646" y2="733" gradientUnits="userSpaceOnUse"><stop stop-color="#FEFDF9"/><stop offset="1" stop-color="#EEECE4"/></linearGradient>
    <linearGradient id="wall" x1="572" y1="135" x2="601" y2="488" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#E8E1D3"/></linearGradient>
    <linearGradient id="end-wall" x1="265" y1="180" x2="481" y2="376" gradientUnits="userSpaceOnUse"><stop stop-color="#F8F5ED"/><stop offset="1" stop-color="#DED7C9"/></linearGradient>
    <linearGradient id="roof" x1="349" y1="74" x2="355" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#2B475A"/><stop offset="1" stop-color="#142F43"/></linearGradient>
    <linearGradient id="glass" x1="501" y1="176" x2="684" y2="376" gradientUnits="userSpaceOnUse"><stop stop-color="#BFDADD"/><stop offset=".5" stop-color="#EAF3EF"/><stop offset="1" stop-color="#90B7BC"/></linearGradient>
