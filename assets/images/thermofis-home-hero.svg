    <linearGradient id="pump-front" x1="156" y1="513" x2="292" y2="688" gradientUnits="userSpaceOnUse"><stop stop-color="#FCFCF7"/><stop offset=".55" stop-color="#E8E9E1"/><stop offset="1" stop-color="#CBCFC8"/></linearGradient>
    <linearGradient id="pump-side" x1="292" y1="575" x2="350" y2="636" gradientUnits="userSpaceOnUse"><stop stop-color="#2E4E62"/><stop offset="1" stop-color="#153449"/></linearGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="90" y2="88"><stop stop-color="#405464"/><stop offset="1" stop-color="#112A3B"/></linearGradient>
